# Example only: install with your own domain and certificate paths.
server {
    listen 443 ssl;
    server_name lockgate.internal;
    ssl_certificate /etc/letsencrypt/live/lockgate.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lockgate.internal/privkey.pem;
    client_max_body_size 1100k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
