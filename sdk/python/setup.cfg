[metadata]
name = lockgate-client
version = 0.1.0
description = Small, dependency-free Python client for LockGate secret approval
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = daddydemir
url = https://github.com/daddydemir/lockgate
project_urls =
    Repository = https://github.com/daddydemir/lockgate
    Issues = https://github.com/daddydemir/lockgate/issues
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Typing :: Typed

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
lockgate_client = py.typed
